<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RecipeBook</title>

<link rel="stylesheet" href="recipes.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="RecipeBook">
<meta property="og:description" content="Find simple and delicious recipes">
<meta property="og:url" content="https://yoururl.com">
<meta property="og:image" content="images/apple-crisp.jpg">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="RecipeBook">
<meta name="twitter:description" content="Find simple and delicious recipes">
<meta name="twitter:image" content="images/apple-crisp.jpg">

<link rel="icon" href="images/recipe-book.png">

</head>

<body>

<header>

<div class="logo">
<img src="images/recipe-book.png" alt="recipe book logo">
<h1>RecipeBook</h1>
</div>

</header>


<section class="search">

<input type="text" placeholder="Find a recipe">

<button>
<img src="images/search.svg" alt="search icon">
</button>

</section>


<main>

<article class="recipe">

<img src="images/apple-crisp.jpg" alt="apple crisp">

<div class="recipe-content">

<span class="tag">dessert</span>

<h2>APPLE CRISP</h2>

<span
class="rating"
role="img"
aria-label="Rating: 4 out of 5 stars"
>
<span aria-hidden="true">⭐</span>
<span aria-hidden="true">⭐</span>
<span aria-hidden="true">⭐</span>
<span aria-hidden="true">⭐</span>
<span aria-hidden="true">☆</span>
</span>

<p class="description">
This apple crisp recipe is a simple yet delicious fall dessert that’s great served warm with vanilla ice cream.
</p>

</div>

</article>

</main>


<footer>

<a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">
Recipe icons created by Freepik - Flaticon
</a>

<div class="social">

<!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->

<a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
<a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
<a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>

</div>

</footer>

</body>
</html>
