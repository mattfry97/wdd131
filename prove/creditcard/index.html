<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Credit Card Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon using emoji -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💳</text></svg>">

    <link rel="stylesheet" href="creditcard.css">
    <script src="creditcard.js" defer></script>
</head>

<body>

<form id="cardForm">

    <div class="card-container">

        <!-- Card Front -->
        <div class="card front">

            <div class="total">TOTAL: $199</div>

            <div class="card-logo">💳</div>

            <div class="card-number">
                <label for="cardNumber">CARD NUMBER</label>
                <input type="text" id="cardNumber" placeholder="1234 5678 9101 1020" maxlength="19">
            </div>

            <div class="card-holder">
                <label for="cardHolder">CARD HOLDER</label>
                <input type="text" id="cardHolder" placeholder="John Doe">
            </div>

            <div id="cardExpiration">
                <label id="expirationDate">EXPIRATION</label>
                <input type="text" id="month" name="expMonth" placeholder="MM" aria-labelledby="expirationDate">
                <input type="text" id="year" name="expYear" placeholder="YY" aria-labelledby="expirationDate">
            </div>

        </div>

        <!-- Card Back -->
        <div class="card back">

            <div class="stripe"></div>

            <div class="cvc">
                <label for="cvc">CVC/CVV</label>
                <input type="text" id="cvc" placeholder="XXX" maxlength="3">
            </div>

        </div>

    </div>

    <button type="submit">Submit</button>

</form>

</body>
</html>
