<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snortleblat Character Card</title>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Snortleblat Character Card">
  <meta property="og:description" content="A fantasy character card built using JavaScript objects with properties and methods.">
  <meta property="og:url" content="https://yourdomain.com/charactercard/">
  <meta property="og:image" content="https://andejuli.github.io/wdd131/character_card/snortleblat.webp">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Snortleblat Character Card">
  <meta name="twitter:description" content="Interactive fantasy character card built with JavaScript objects.">
  <meta name="twitter:image" content="https://andejuli.github.io/wdd131/character_card/snortleblat.webp">

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico">

  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <link rel="stylesheet" href="charactercard.css">
  <script src="charactercard.js" defer></script>
</head>

<body>

  <div class="card">
    <img id="characterImage" class="image" src="" alt="">
    <div class="name" id="characterName"></div>

    <div class="stats">
      <p>Class: <span id="characterClass"></span></p>
      <p>Level: <span id="characterLevel"></span></p>
      <p>Health: <span id="characterHealth"></span></p>
    </div>

    <div class="buttons">
      <button onclick="character.attacked()">Attack</button>
      <button onclick="character.levelUp()">Level Up</button>
    </div>
  </div>

</body>
</html>
